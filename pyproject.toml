[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "care-ops-agent"
version = "0.1.0"
description = "Multi-agent home care visit incident resolution"
requires-python = ">=3.10"
license = {text = "MIT"}
[project.scripts]
care-ops = "care_ops.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
